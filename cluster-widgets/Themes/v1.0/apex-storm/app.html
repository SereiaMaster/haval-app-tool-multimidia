            text("title", card === 3 ? "CLIMATIZAÇÃO" : detail ? menuItems[menuIndex].title : "MENU PRINCIPAL");
            var index = view === "settings" ? settingIndex : menuIndex;
            text("counter", view === "menu" || view === "settings" ? (index + 1) + "/" + (view === "menu" ? menuItems.length : settingItems.length) : "");
            text("hint", view === "ac" ? "↑ ↓ ajustar · OK alternar" : view === "menu" ? "↑ ↓ navegar · OK abrir" : view === "settings" ? "↑ ↓ escolher · OK alterar · ↩" : view === "music" ? "↩ voltar" : "↑ ↓ alternar · ↩ voltar");
            text("feedback", feedback);
            elements.hint.hidden = Boolean(feedback);
            elements.feedback.hidden = !feedback;
            if (view === "menu") slidingRows(menuRows, menuIndex);
            if (view === "settings") {
                slidingRows(settingRows, settingIndex);
                settingItems.forEach(function (item) {
                    var value = state[item.field] === null ? "--" : labels[item.field][state[item.field]];
                    text("setting-" + item.field, value);
                });
            }
            if (view === "info") renderInfo();
            if (view === "graphs") renderGraph();
            if (view === "music") renderMusic();
            if (view === "trips") renderTrips();
            if (view === "ac") renderAc();
        }

        function schedule() {
            if (!disposed && (card === 1 || card === 3) && frame === null) frame = window.requestAnimationFrame(render);
        }

        function status(message, expected) {
            feedback = message;
            awaiting = expected || null;
            if (feedbackTimer !== null) window.clearTimeout(feedbackTimer);
            feedbackTimer = window.setTimeout(function () {
                feedbackTimer = null;
                feedback = awaiting ? "AGUARDANDO DADOS" : "";
                awaiting = null;
                schedule();
            }, 2600);
            schedule();
        }

        function send(writes, action, expected) {
            var bridge = window.Android;
            if (!bridge || (writes.length && typeof bridge.updateCarData !== "function") || (action && typeof bridge.triggerSystemAction !== "function")) {
                status("AÇÃO INDISPONÍVEL");
                return;
            }
            status(action === "RESET_DRIVE_INFO" ? "ZERAGEM SOLICITADA" : "AGUARDANDO RETORNO", expected);
            try {
                if (action) bridge.triggerSystemAction(action);
                writes.forEach(function (write) { bridge.updateCarData(write[0], String(write[1])); });
            } catch (error) {
                status("AÇÃO INDISPONÍVEL");
            }
        }

        function known(fields) {
            var available = fields.every(function (field) { return state[field] !== null; });
            if (!available) status("AGUARDANDO DADOS");
            return available;
        }

        function changeSetting() {
            var item = settingItems[settingIndex];
            if (!known([item.field])) return;
            var next = item.values[(item.values.indexOf(state[item.field]) + 1) % item.values.length];
            var expected = {};
            expected[item.field] = next;
            send([[item.key, next]], null, expected);
        }

        function acKey(key) {
            if (key === "ENTER") { acFocus = acFocus === "fan" ? "temp" : "fan"; schedule(); return; }
            if (key === "BACK_LONG") {
                if (known(["acRecycle"])) {
                    var recycle = state.acRecycle === 1 ? 0 : 1;
                    send([["car.hvac.cycle_mode", recycle]], null, { acRecycle: recycle });
                }
                return;
            }
            if (key === "ENTER_LONG") {
                if (known(["acAuto"])) {
                    var auto = state.acAuto === 1 ? 0 : 1;
                    send([["car.hvac.auto_enable", auto]], "CANCEL_MAX_AC", { acAuto: auto });
                }
                return;
            }
            if (key !== "UP" && key !== "DOWN") return;
            if (acFocus === "temp") {
                if (!known(["acTemp"])) return;
                var temp = Math.max(16, Math.min(32, Math.round((state.acTemp + (key === "UP" ? 0.5 : -0.5)) * 2) / 2));
                if (temp !== state.acTemp) send([["car.hvac.driver_temperature", temp.toFixed(1)]], null, { acTemp: temp });
                return;
            }
            if (!known(["acFan", "acPower"])) return;
            var fan = state.acPower === 0 ? 0 : state.acFan;
            var nextFan = Math.max(0, Math.min(7, fan + (key === "UP" ? 1 : -1)));
            if (fan === nextFan) return;
            var writes = [];
            if (nextFan > 0 && state.acPower === 0) writes.push(["car.hvac.power_mode", 1]);
            if (nextFan === 0) writes.push(["car.hvac.power_mode", 0]);
            writes.push(["car.hvac.fan_speed", nextFan]);
            send(writes, null, { acFan: nextFan });
        }

        function mainKey(key) {
            var step = key === "UP" ? -1 : key === "DOWN" ? 1 : 0;
            if (!detail) {
                if (key === "ENTER") detail = true;
                if (step) menuIndex = (menuIndex + step + menuItems.length) % menuItems.length;
                schedule();
                return;
            }
            if (key === "BACK") { detail = false; schedule(); return; }
            var view = menuItems[menuIndex].view;
            if (view === "info" && step) infoIndex = 1 - infoIndex;
            if (view === "graphs" && step) graphIndex = 1 - graphIndex;
            if (view === "settings") {
                if (step) settingIndex = (settingIndex + step + settingItems.length) % settingItems.length;
                if (key === "ENTER") changeSetting();
            }
            if (view === "trips") {
                if (step) tripIndex = 1 - tripIndex;
                if (key === "ENTER_LONG" && tripIndex === 1) send([], "RESET_DRIVE_INFO", { tripBDistance: 0 });
            }
            schedule();
        }

        function onKeyEvent(keyName) {
            if (disposed || (card !== 1 && card !== 3)) return;
            var key = typeof keyName === "string" ? keyName.toUpperCase() : "";
            if (["UP", "DOWN", "ENTER", "BACK", "ENTER_LONG", "BACK_LONG"].indexOf(key) < 0) return;
            var now = Date.now();
            if (now - lastKeyAt < 50) return;
            lastKeyAt = now;
            if (card === 3) acKey(key); else mainKey(key);
        }

        function onCardChanged(value) {
            var next = numberOrNull(value);
            if (disposed || [0, 1, 3].indexOf(next) < 0) return;
            if (next === 1 && card !== 1) detail = false;
            card = next;
            mount.hidden = card !== 1 && card !== 3;
            root.classList.toggle("menu-open", !mount.hidden);
            root.classList.toggle("card-main", card === 1);
            root.classList.toggle("card-ac", card === 3);
            root.classList.toggle("card-native", card === 0);
            root.setAttribute("data-card-id", String(card));
            feedback = "";
            awaiting = null;
            if (feedbackTimer !== null) { window.clearTimeout(feedbackTimer); feedbackTimer = null; }
            schedule();
        }

        function sample(metric, value) {
            if (value === null) return;
            var now = Date.now();
            if (now - sampledAt[metric] < 250 && history[metric].length) history[metric][history[metric].length - 1] = value;
            else {
                sampledAt[metric] = now;
                history[metric].push(value);
                if (history[metric].length > 18) history[metric].shift();
            }
        }

        function update(key, value, allowAliases) {
            if (disposed) return;
            var field = keyFields[key] || (allowAliases ? aliases[key] : null);
            if (!field) return;
            if (keyFields[key]) seen[field] = true;
            else if (seen[field]) return;
            var next = normalize(field, value);
            if (awaiting && Object.prototype.hasOwnProperty.call(awaiting, field) && awaiting[field] === next) {
                delete awaiting[field];
                if (!Object.keys(awaiting).length) {
                    awaiting = null;
                    feedback = "";
                    if (feedbackTimer !== null) { window.clearTimeout(feedbackTimer); feedbackTimer = null; }
                    schedule();
                }
            }
            if (state[field] === next) return;
            state[field] = next;
            if (field === "speed") sample("speed", next);
            if (field === "voltage" || field === "current") sample("power", power());
            schedule();
        }

        function onClick(event) {
            if (disposed || mount.hidden) return;
            var button = event.target.closest("button");
            if (!button || !mount.contains(button)) return;
            if (card === 1) {
                if (button.hasAttribute("data-apex-menu")) { menuIndex = Number(button.getAttribute("data-apex-menu")); detail = true; }
                if (button.hasAttribute("data-apex-setting")) { settingIndex = Number(button.getAttribute("data-apex-setting")); changeSetting(); }
                ["info", "graph", "trip"].forEach(function (name) {
                    if (!button.hasAttribute("data-apex-" + name)) return;
                    var index = Number(button.getAttribute("data-apex-" + name));
                    if (name === "info") infoIndex = index;
                    if (name === "graph") graphIndex = index;
                    if (name === "trip") tripIndex = index;
                });
            }
            if (card === 3 && button.hasAttribute("data-apex-ac")) acFocus = button.getAttribute("data-apex-ac");
            schedule();
        }

        function cleanup() {
            if (disposed) return;
            disposed = true;
            if (frame !== null) window.cancelAnimationFrame(frame);
            if (feedbackTimer !== null) window.clearTimeout(feedbackTimer);
            frame = null;
            feedbackTimer = null;
            awaiting = null;
            history.speed.length = 0;
            history.power.length = 0;
            mount.removeEventListener("click", onClick);
            mount.hidden = true;
            root.classList.remove("menu-open", "card-main", "card-ac", "card-native");
        }

        mount.addEventListener("click", onClick);
        onCardChanged(0);
        return { keys: Object.keys(keyFields), update: update, onCardChanged: onCardChanged, onKeyEvent: onKeyEvent, cleanup: cleanup };
    }

    window.StormMenus = { create: create };
})();
</script>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------------
  // Fixed geometry (1920 x 720 reference plane). Gauges sit left/right; the
  // center column is left untouched for the OEM ADAS / speed-limit / ESP layer.
  // ---------------------------------------------------------------------------
  var W = 1920, H = 720;
  // Circles hug the clear side bands so they stay fully clear of the center ADAS
  // zone (x 520-1400). ncx/ncy = where the number (and the biting maw) sit, kept
  // high so the number clears the fixed OEM telltale band on the left.
  var LEFT  = { cx: 262,  cy: 360, r: 196, ncx: 262,  ncy: 242 };   // speedometer
  var RIGHT = { cx: 1658, cy: 360, r: 196, ncx: 1658, ncy: 242 };   // bipolar power meter
  // When the menu overlay is open the right circular meter is replaced by a
  // vertical bipolar bar in the column left of the menu panel: neon grows from
  // the center upward (traction) / downward (regen), same colors and scales.
  var BAR = { x: 1452, w: 28, cy: 400, h: 142 };
  var SWEEP = 230;            // degrees of arc used by the scale (wide gap at bottom)
  var A0 = 155;               // start angle (deg): lower-left; +SWEEP = lower-right
  var TOP = 270;              // top of the arc (12 o'clock) = power zero point
  // NOTE: the wide bottom gap keeps the lower arc above the fixed OEM telltales on
  // the left (READY, placa/traffic-sign, ESP) so the ring never overlaps them.
  // Independent scales: traction (positive) reaches ~130 kW, regen (negative)
  // rarely passes ~45 kW. Separate full-scale values per direction so the regen
  // side actually sweeps its arc (and shows its color) instead of barely moving.
  var POWER_MAX_TRACTION = 130, POWER_MAX_REGEN = 45;   // kW, overridable in config
  var FRAME_MS = 1000 / 30;   // 30fps ceiling, same discipline as Apex GT
  var ACCEL_MAX = 14;         // km/h per second that maps to full excitement
  var SPARK_POOL = 90;        // hard cap on live particles (pre-allocated)

  // Speed -> color ramp. Cold neon blue at rest, sweeping to hot red at the
  // configured saturation speed. Reactive: it reverses on its own as speed drops.
  var RAMP = [
    [0.00, [ 46, 139, 255]],  // neon blue
    [0.34, [ 25, 224, 214]],  // cyan
    [0.60, [122,  60, 255]],  // violet
    [0.82, [255,  45, 155]],  // magenta
    [1.00, [255,  59,  46]]   // red
  ];
  var REGEN = [60, 255, 170];               // neon green for energy recovery

  var INTENSITY = { Calmo: 0.55, Equilibrado: 1.0, Tempestade: 1.7 };

  // ---------------------------------------------------------------------------
  // Config (overridable via theme.xml preferences; safe defaults baked in).
  // ---------------------------------------------------------------------------
  var cfg = {
    intensity: "Equilibrado", lightning: true, sparks: true, saturateSpeed: 160,
    // Configurable colors (theme.xml `color` configs). Defaults = original look.
    coldColor: [46, 139, 255], hotColor: [255, 59, 46], regenColor: [60, 255, 170],
    // Configurable bipolar power-meter full-scale (kW).
    tractionScale: POWER_MAX_TRACTION, regenScale: POWER_MAX_REGEN
  };

  // "#RRGGBB" -> [r,g,b]; returns null on anything we can't parse.
  function parseHex(s) {
    if (!s) return null;
    var m = String(s).trim().replace(/^#/, "");
    if (m.length === 3) m = m[0] + m[0] + m[1] + m[1] + m[2] + m[2];
    if (!/^[0-9a-fA-F]{6}$/.test(m)) return null;
    return [parseInt(m.slice(0, 2), 16), parseInt(m.slice(2, 4), 16), parseInt(m.slice(4, 6), 16)];
  }

  var canvas = document.getElementById("storm");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var els = {
    speed: document.getElementById("speed-value"),
    power: document.getElementById("power-value"),
    rightState: document.getElementById("right-state"),
    gear: document.getElementById("gear"),
    drive: document.getElementById("drive"),
    sportWash: document.getElementById("sport-wash"),
    speedBox: document.getElementById("speed-box"),
    rightBox: document.getElementById("right-box"),
    gearBox: document.getElementById("gear"),
    banner: document.getElementById("beast-banner"),
    // Telemetry readouts (ApexGT parity)
    outTemp: document.getElementById("out-temp"),
    inTemp: document.getElementById("in-temp"),
    fuelPercent: document.getElementById("fuel-percent"),
    fuelLiters: document.getElementById("fuel-liters"),
    fuelRange: document.getElementById("fuel-range"),
    fuelFill: document.getElementById("fuel-fill"),
    batteryPercent: document.getElementById("battery-percent"),
    batteryRange: document.getElementById("battery-range"),
    batteryFill: document.getElementById("battery-fill"),
    odometer: document.getElementById("odometer"),
    trip: document.getElementById("trip-distance"),
    consumption: document.getElementById("average-consumption"),
    consumptionUnit: document.getElementById("consumption-unit"),
    totalRange: document.getElementById("total-range"),
    propulsion: document.getElementById("propulsion-mode"),
    rpmReadout: document.getElementById("rpm-readout"),
    engineRpm: document.getElementById("engine-rpm")
  };

  var motion = window.matchMedia("(prefers-reduced-motion: reduce)");

  // ---------------------------------------------------------------------------
  // Live state + smoothing.
  // ---------------------------------------------------------------------------
  var state = {
    speed: 0, power: 0, gear: "--", drive: "--",
    voltage: null, current: null,
    dSpeed: 0, dPower: 0, prevDSpeed: 0,
    accel: 0, gearFlash: 0, sportMix: 0,
    // Full ApexGT telemetry set (null = not yet received).
    rpm: null, odometer: null, propulsion: "--",
    insideTemp: null, outsideTemp: null, tempUnit: null,
    fuel: null, battery: null, fuelRange: null, batteryRange: null,
    trip: null, consumption: null,
    carPlayInDash: false, projectionMirrorInDash: false,
    aaClusterInDash: false, projectionPreparingD3: false,
    card: 1, disposed: false, active: true
  };

  // Beast Mode: unleashed when drive mode switches to SPORT.
  var beast = { sport: false, intro: 0, shake: 0, mawOpen: 1, claws: [], waves: [] };
  var shakeOn = false;

  var sparks = [];
  for (var i = 0; i < SPARK_POOL; i++) sparks.push({ life: 0 });
  var lastFrame = 0, raf = 0;
  var staticLayer = {};
  // Menu subsystem (card 1 MENU / card 3 AC). Instantiated at bootstrap; the
  // bridge hooks forward key events / card changes / telemetry to it.
  var menus = null;

  var GEARS = { "0": "N", "1": "N", "2": "D", "3": "P", "4": "R" };
  var DRIVES = { "0": "NORMAL", "1": "SPORT", "2": "ECO", "3": "NEVE", "4": "AREIA", "5": "LAMA", "11": "AWD" };
  var PROPULSION = { "0": "HEV", "1": "EVP", "3": "EV" };
  var FUEL_TANK_LITERS = 55;

  function rad(d) { return d * Math.PI / 180; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function colorFor(t) {
    t = clamp(t, 0, 1);
    for (var k = 1; k < RAMP.length; k++) {
      if (t <= RAMP[k][0]) {
        var a = RAMP[k - 1], b = RAMP[k];
        var f = (t - a[0]) / (b[0] - a[0]);
        return [Math.round(lerp(a[1][0], b[1][0], f)),
                Math.round(lerp(a[1][1], b[1][1], f)),
                Math.round(lerp(a[1][2], b[1][2], f))];
      }
    }
    return RAMP[RAMP.length - 1][1].slice();
  }
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  // Push the configurable colors into the speed ramp (cold = start, hot = end),
  // the regen color, and the unified SPORT wash gradient. Called after config
  // load and whenever a color preference changes.
  function applyColors() {
    RAMP[0][1] = cfg.coldColor.slice();
    RAMP[RAMP.length - 1][1] = cfg.hotColor.slice();
    REGEN = cfg.regenColor.slice();
    if (els.sportWash) {
      var h = cfg.hotColor;
      var c = h[0] + "," + h[1] + "," + h[2];
      // Continuous, low-alpha glow: left + right + a wide bottom sweep across the
      // footer, all fading to transparent toward the center ADAS window.
      els.sportWash.style.background =
        "radial-gradient(1200px 820px at 13% 50%, rgba(" + c + ",0.17), rgba(" + c + ",0) 60%)," +
        "radial-gradient(1200px 820px at 87% 50%, rgba(" + c + ",0.17), rgba(" + c + ",0) 60%)," +
        "radial-gradient(1800px 520px at 50% 116%, rgba(" + c + ",0.13), rgba(" + c + ",0) 72%)";
    }
  }

  // --- Static layer (track + ticks), rendered once per gauge, then blitted. ---
  function buildStatic(g) {
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var x = c.getContext("2d");
    x.lineCap = "round";
    x.strokeStyle = "rgba(120,150,185,0.13)";
    x.lineWidth = 38;                              // same thickness as the band
    x.beginPath();
    x.arc(g.cx, g.cy, g.r, rad(A0), rad(A0 + SWEEP), false);
    x.stroke();
    for (var i = 0; i <= 8; i++) {
      var ang = rad(A0 + (i / 8) * SWEEP);
      var major = (i % 2 === 0);
      var ro = g.r + 44, ri = g.r - (major ? 44 : 34);
      x.strokeStyle = major ? "rgba(195,218,242,0.5)" : "rgba(150,180,210,0.25)";
      x.lineWidth = major ? 4 : 2;
      x.beginPath();
      x.moveTo(g.cx + Math.cos(ang) * ri, g.cy + Math.sin(ang) * ri);
      x.lineTo(g.cx + Math.cos(ang) * ro, g.cy + Math.sin(ang) * ro);
      x.stroke();
    }
    return c;
  }

  // --- Thick glowing "tube" band between two angles (gives volume). ---
  function drawBand(g, a0, a1, anti, color) {
    function stroke(w, style, comp) {
      ctx.globalCompositeOperation = comp;
      ctx.strokeStyle = style; ctx.lineWidth = w; ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.r, rad(a0), rad(a1), anti); ctx.stroke();
    }
    stroke(38, rgba(color, 0.62), "source-over");  // solid body = volume
    stroke(96, rgba(color, 0.11), "lighter");       // broad outer bloom
    stroke(62, rgba(color, 0.22), "lighter");       // outer halo
    stroke(34, rgba(color, 0.40), "lighter");       // inner halo
    stroke(16, rgba(color, 0.95), "lighter");       // bright core
    stroke(4, "rgba(246,251,255,0.98)", "lighter"); // white-hot center line
    ctx.globalCompositeOperation = "source-over";
  }

  // --- Vertical bipolar power bar (menu-open mode). Center = zero; up = traction,
  //     down = regen. Mirrors drawBand's glow stack on a straight segment. ---
  function barSeg(x, y0, y1, w, style, comp) {
    ctx.globalCompositeOperation = comp;
    ctx.strokeStyle = style; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  }
  function drawPowerBar(frac, color) {
    var x = BAR.x, cy = BAR.cy, h = BAR.h, w = BAR.w;
    // Track (full travel both ways) + zero tick.
    barSeg(x, cy - h, cy + h, w, "rgba(120,150,185,0.13)", "source-over");
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "rgba(205,225,245,0.55)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x - w / 2 - 11, cy); ctx.lineTo(x + w / 2 + 11, cy); ctx.stroke();
    // Neon fill from center to the tip.
    var tip = cy - frac * h;                     // frac>0 -> up; frac<0 -> down
    barSeg(x, cy, tip, w, rgba(color, 0.62), "source-over");
    barSeg(x, cy, tip, w + 58, rgba(color, 0.10), "lighter");
    barSeg(x, cy, tip, w + 26, rgba(color, 0.22), "lighter");
    barSeg(x, cy, tip, w - 4, rgba(color, 0.42), "lighter");
    barSeg(x, cy, tip, Math.max(4, w - 14), rgba(color, 0.92), "lighter");
    barSeg(x, cy, tip, 4, "rgba(246,251,255,0.96)", "lighter");
    ctx.globalCompositeOperation = "source-over";
  }

  // --- Electric overload running ALONG the whole colored band. ---
  function arcLightning(g, a0, a1, color, power) {
    if (power <= 0.05) return;
    var span = a1 - a0;                              // signed degrees
    var steps = Math.max(8, Math.round(Math.abs(span) / 10));
    var filaments = 1 + Math.floor(power * 2.6);     // denser with excitement (perf-trimmed)
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (var fi = 0; fi < filaments; fi++) {
      var amp = 10 + power * 20;                      // radial wander across the band
      var tinted = (fi % 2 === 0);
      ctx.beginPath();
      for (var s = 0; s <= steps; s++) {
        var t = s / steps;
        var ang = rad(a0 + span * t);
        var edge = (s === 0 || s === steps) ? 0.25 : 1; // settle onto the band at ends
        var rr = g.r + (Math.random() - 0.5) * 2 * amp * edge;
        var px = g.cx + Math.cos(ang) * rr;
        var py = g.cy + Math.sin(ang) * rr;
        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = tinted ? rgba(color, 0.35 * power + 0.1)
                               : "rgba(235,248,255," + (0.3 + 0.45 * power) + ")";
      ctx.lineWidth = tinted ? 3 : 1.5;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function tipPoint(g, angDeg) {
    var a = rad(angDeg);
    return { x: g.cx + Math.cos(a) * g.r, y: g.cy + Math.sin(a) * g.r };
  }
  function drawTip(g, angDeg, color) {
    var p = tipPoint(g, angDeg);
    ctx.globalCompositeOperation = "lighter";
    var glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 62);
    glow.addColorStop(0, "rgba(255,255,255,0.98)");
    glow.addColorStop(0.28, rgba(color, 0.92));
    glow.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(p.x, p.y, 62, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    return p;
  }

  // --- Sparks flung off the tip; emission grows with speed. ---
  function emitSparks(tip, baseAngDeg, n, color) {
    var base = rad(baseAngDeg);
    for (var e = 0; e < n; e++) {
      var p = null;
      for (var i = 0; i < sparks.length; i++) { if (sparks[i].life <= 0) { p = sparks[i]; break; } }
      if (!p) return;                                 // pool exhausted -> drop (cap kept)
      var dir = base + (Math.random() - 0.5) * 2.4;
      var spd = 1.6 + Math.random() * 4.2;
      p.x = tip.x; p.y = tip.y;
      p.vx = Math.cos(dir) * spd;
      p.vy = Math.sin(dir) * spd - 1.4;
      p.life = p.max = 0.45 + Math.random() * 0.4;
      p.color = color;
    }
  }
  function drawSparks(dt) {
    ctx.globalCompositeOperation = "lighter";
    var sec = dt / 1000;
    for (var i = 0; i < sparks.length; i++) {
      var p = sparks[i];
      if (p.life <= 0) continue;
      p.life -= sec;
      p.vy += 11 * sec;                               // gravity
      var nx = p.x + p.vx, ny = p.y + p.vy;
      var a = clamp(p.life / p.max, 0, 1);
      ctx.strokeStyle = rgba(p.color, 0.9 * a);
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();
      p.x = nx; p.y = ny;
    }
    ctx.globalCompositeOperation = "source-over";
  }
  function anySpark() { for (var i = 0; i < sparks.length; i++) if (sparks[i].life > 0) return true; return false; }

  // --- SPORT background: red neon pools behind each dial + "warp" speed streaks
  //     bursting outward on the OUTER side of each gauge (center ADAS stays clear).
  //     Additive only, no filters; intensity scales with the sport fade + speed. ---
  function drawSportBackground(mix, now, speedT, leftOnly) {
    ctx.save();
    // Keep every SPORT effect inside the side bands; the ADAS window stays clear.
    ctx.beginPath(); ctx.rect(0, 0, 520, H); ctx.rect(1400, 0, 520, H); ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    // Red glow pool behind each dial (fades out before reaching the center column).
    // Softer than before (less flooding) and tinted by the configurable hot color;
    // the full-cluster #sport-wash now carries most of the SPORT tint.
    var hc = cfg.hotColor, hcs = hc[0] + "," + hc[1] + "," + hc[2];
    (leftOnly ? [LEFT] : [LEFT, RIGHT]).forEach(function (g) {
      var pool = ctx.createRadialGradient(g.cx, g.cy, g.r * 0.35, g.cx, g.cy, g.r + 150);
      pool.addColorStop(0, "rgba(" + hcs + ",0)");
      pool.addColorStop(0.55, "rgba(" + hcs + "," + (0.06 * mix) + ")");
      pool.addColorStop(1, "rgba(" + hcs + ",0)");
      ctx.fillStyle = pool;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.r + 150, 0, Math.PI * 2); ctx.fill();
    });
    // Warp streaks: left dial -> left hemisphere, right dial -> right hemisphere.
    var baseLen = 80 + 220 * speedT;           // longer streaks, visible even parked
    ctx.lineCap = "round";
    (leftOnly ? [[LEFT, 90]] : [[LEFT, 90], [RIGHT, -90]]).forEach(function (pair) {
      var g = pair[0], a0 = pair[1];           // hemisphere facing away from center
      var n = cfg.intensity === "Calmo" ? 9 : (cfg.intensity === "Tempestade" ? 16 : 13);  // streak fan (perf-aware)
      for (var k = 0; k < n; k++) {
        var frac = k / (n - 1);
        var a = rad(a0 + frac * 180);
        var phase = ((now * 0.0012 * (0.5 + speedT) + k * 0.313) % 1 + 1) % 1;
        var r0 = g.r + 50 + phase * (90 + 220 * speedT);
        var len = baseLen * (0.5 + 0.5 * Math.sin(frac * Math.PI));
        var x0 = g.cx + Math.cos(a) * r0,       y0 = g.cy + Math.sin(a) * r0;
        var x1 = g.cx + Math.cos(a) * (r0 + len), y1 = g.cy + Math.sin(a) * (r0 + len);
        // Brighter streaks with a higher floor so they read at any speed, while
        // the red glow pools behind them are softer than before.
        var al = 0.5 * mix * (1 - phase) * (0.65 + 0.35 * speedT);
        var grad = ctx.createLinearGradient(x0, y0, x1, y1);
        grad.addColorStop(0, "rgba(255,80,55,0)");
        grad.addColorStop(0.45, "rgba(255,90,60," + al + ")");
        grad.addColorStop(0.8, "rgba(255,210,190," + (al * 0.9) + ")");
        grad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.strokeStyle = grad; ctx.lineWidth = 3.4;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    });
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }

  function signedPower() {
    if (state.power !== 0 || (state.voltage === null && state.current === null)) {
      // demo / direct power path
    }
    if (state.voltage !== null && state.current !== null) {
      var p = state.voltage * state.current / 1000;
      return Number.isFinite(p) ? p : 0;
    }
    return state.power;
  }

  // ---------------------------------------------------------------------------
  // Beast Mode (SPORT) — jaws biting the number, claw rips, shockwaves, shake.
  // ---------------------------------------------------------------------------
  function triggerBeast() {
    beast.intro = 1; beast.shake = 1; beast.mawOpen = 1;
    var hot = colorFor(1);
    spawnClaws(hot);
    beast.waves.push({ cx: LEFT.cx, cy: LEFT.cy, life: 1, color: hot });
    beast.waves.push({ cx: RIGHT.cx, cy: RIGHT.cy, life: 1, color: hot });
    if (els.banner) {
      els.banner.classList.remove("show");
      void els.banner.offsetWidth;                 // restart the CSS animation
      els.banner.classList.add("show");
      if (beastBannerTimer) clearTimeout(beastBannerTimer);
      beastBannerTimer = setTimeout(function () { if (els.banner) els.banner.classList.remove("show"); }, 1300);
    }
  }

  function spawnClaws(color) {
    var ang = -0.45, len = 1550;
    var dx = Math.cos(ang), dy = Math.sin(ang);
    var px = -dy, py = dx;                          // perpendicular spacing
    for (var k = 0; k < 3; k++) {
      var s = (k - 1) * 92;
      var cx = 960 + px * s, cy = 360 + py * s;
      beast.claws.push({
        x1: cx - dx * len / 2, y1: cy - dy * len / 2,
        x2: cx + dx * len / 2, y2: cy + dy * len / 2,
        life: 1, color: color
      });
    }
  }

  function drawClaws(dt) {
    if (!beast.claws.length) return;
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (var i = beast.claws.length - 1; i >= 0; i--) {
      var c = beast.claws[i];
      c.life -= dt / 650;
      if (c.life <= 0) { beast.claws.splice(i, 1); continue; }
      var reveal = clamp((1 - c.life) * 2.6, 0, 1);
      var a = Math.min(1, c.life * 1.5);
      var ex = c.x1 + (c.x2 - c.x1) * reveal;
      var ey = c.y1 + (c.y2 - c.y1) * reveal;
      ctx.strokeStyle = rgba(c.color, 0.45 * a);
      ctx.lineWidth = 15;
      ctx.beginPath(); ctx.moveTo(c.x1, c.y1); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255," + (0.92 * a) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(c.x1, c.y1); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function drawWaves(dt) {
    if (!beast.waves.length) return;
    ctx.globalCompositeOperation = "lighter";
    for (var i = beast.waves.length - 1; i >= 0; i--) {
      var w = beast.waves[i];
      w.life -= dt / 520;
      if (w.life <= 0) { beast.waves.splice(i, 1); continue; }
      var r = (1 - w.life) * 360 + 28;
      var a = w.life;
      ctx.strokeStyle = rgba(w.color, 0.5 * a);
      ctx.lineWidth = 10 * a + 2;
      ctx.beginPath(); ctx.arc(w.cx, w.cy, r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // Sculpted fanged jaws framing the number. Dark metallic body + neon rim +
  // glossy hot tip, echoing the Apex metal-with-neon-edge look (no flat triangles).
  // openv: 1 = retracted/hidden, ~0.14 = biting.
  function drawMaw(g, openv, color, pulse) {
    var alpha = clamp((1 - openv) / 0.5, 0, 1);
    if (alpha <= 0.01) return;
    var cx = g.ncx, cy = g.ncy;
    var gap = 80 + openv * 160 + pulse * 8;
    var halfW = 152, rows = 5;                       // fewer, bigger, meaner fangs
    var spacing = (halfW * 2) / (rows - 1);
    var w = spacing * 0.46;                          // bold bases, slight gap between teeth
    for (var side = 0; side < 2; side++) {
      var dir = side === 0 ? -1 : 1;                 // -1 = top row, +1 = bottom row
      var jawY = cy + dir * gap;

      // Thin glowing jaw ridge, bowed slightly toward the number at the center.
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      ctx.strokeStyle = rgba(color, 0.3 * alpha);
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (var j = 0; j < rows; j++) {
        var ju = (j / (rows - 1)) * 2 - 1;
        var jx = cx + ju * halfW;
        var jy = jawY + dir * (1 - ju * ju) * 9;
        if (j === 0) ctx.moveTo(jx, jy); else ctx.lineTo(jx, jy);
      }
      ctx.stroke();

      for (var i = 0; i < rows; i++) {
        var u = (i / (rows - 1)) * 2 - 1;            // -1..1 across the jaw
        var fx = cx + u * halfW;
        var fang = 46 + 46 * (1 - Math.abs(u));      // long canines, dramatic taper
        var baseY = jawY + dir * (1 - u * u) * 10;
        var tipX = fx - u * 16;                       // tips hook toward the center
        var tipY = baseY - dir * fang;               // sharp point toward the number
        var midY = baseY - dir * fang * 0.52;

        // Curved, tapered fang silhouette (concave sides + hook -> predator tooth).
        ctx.beginPath();
        ctx.moveTo(fx - w, baseY);
        ctx.lineTo(fx + w, baseY);
        ctx.quadraticCurveTo(fx + w * 0.3, midY, tipX, tipY);
        ctx.quadraticCurveTo(fx - w * 0.3, midY, fx - w, baseY);
        ctx.closePath();

        // Soft neon bloom behind the fang (makes it read as a glowing solid, not a wireframe).
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = rgba(color, 0.16 * alpha);
        ctx.lineWidth = 12;
        ctx.stroke();

        // Solid, self-illuminated body brightening to a white-hot tip.
        ctx.globalCompositeOperation = "source-over";
        var grd = ctx.createLinearGradient(fx, baseY, tipX, tipY);
        grd.addColorStop(0, rgba(color, 0.5 * alpha));
        grd.addColorStop(0.55, rgba(color, 0.9 * alpha));
        grd.addColorStop(1, "rgba(250,253,255," + (0.98 * alpha) + ")");
        ctx.fillStyle = grd;
        ctx.fill();

        // Crisp neon rim.
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = rgba(color, 0.9 * alpha);
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Glossy hot point.
        var tg = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 10);
        tg.addColorStop(0, "rgba(255,255,255," + (0.95 * alpha) + ")");
        tg.addColorStop(1, rgba(color, 0));
        ctx.fillStyle = tg;
        ctx.beginPath(); ctx.arc(tipX, tipY, 10, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // ---------------------------------------------------------------------------
  // Frame
  // ---------------------------------------------------------------------------
  function render(now) {
    raf = 0;
    if (state.disposed || !state.active) return;
    var dt = lastFrame ? (now - lastFrame) : FRAME_MS;
    if (dt < FRAME_MS) { raf = requestAnimationFrame(render); return; }
    lastFrame = now;
    dt = Math.min(dt, 120);

    // smoothing
    var kS = 1 - Math.exp(-dt / 140);
    state.prevDSpeed = state.dSpeed;
    state.dSpeed += (state.speed - state.dSpeed) * kS;
    state.dPower += (signedPower() - state.dPower) * (1 - Math.exp(-dt / 110));
    var instAccel = (state.dSpeed - state.prevDSpeed) / (dt / 1000);
    state.accel += (instAccel - state.accel) * 0.2;
    if (state.gearFlash > 0) state.gearFlash = Math.max(0, state.gearFlash - dt / 450);

    // Beast Mode timers
    if (beast.intro > 0) beast.intro = Math.max(0, beast.intro - dt / 900);
    if (beast.shake > 0) beast.shake = Math.max(0, beast.shake - dt / 520);
    var mawTarget = beast.sport ? 0.14 : 1;
    beast.mawOpen += (mawTarget - beast.mawOpen) * (1 - Math.exp(-dt / 110));
    state.sportMix += ((beast.sport ? 1 : 0) - state.sportMix) * (1 - Math.exp(-dt / 260));

    var sat = cfg.saturateSpeed > 0 ? cfg.saturateSpeed : 160;
    var speedT = clamp(state.dSpeed / sat, 0, 1);
    var sportK = beast.sport ? 1.7 : 1;
    // In Sport the hue is pushed angrier (hotter) and effects are cranked up.
    var colorT = beast.sport ? clamp(speedT + 0.24, 0, 1) : speedT;
    var color = colorFor(colorT);                     // both gauges share the speed color
    var scale = INTENSITY[cfg.intensity] || 1;
    var accelN = clamp(state.accel / ACCEL_MAX, 0, 1);
    // "overload" building with speed (+ a push from acceleration, gear change, Sport)
    var overload = clamp(((0.75 * speedT + 0.5 * accelN) * scale + state.gearFlash + beast.intro * 0.6) * sportK, 0, 1.6);

    var fSpeed = clamp(state.dSpeed / sat, 0, 1);
    // Bipolar meter with independent full-scale per direction so the (small)
    // regen range sweeps its arc as fully as the (large) traction range.
    var pmax = state.dPower >= 0 ? (cfg.tractionScale || POWER_MAX_TRACTION)
                                 : (cfg.regenScale || POWER_MAX_REGEN);
    var powerFrac = clamp(state.dPower / pmax, -1, 1);
    var regen = state.dPower < -0.3;
    var rColor = regen ? REGEN : color;

    // When the menu overlay is up (card 1 MENU / 3 AC) the right dial becomes a
    // vertical bipolar bar in the column left of the panel; the circular meter and
    // its ticks are suppressed. The left speedometer always stays circular. The
    // menu module owns visibility, so trust the .menu-open class it sets on #stage.
    var menuOpen = stage.classList.contains("menu-open");

    ctx.clearRect(0, 0, W, H);
    // Hard guarantee: all canvas content (gauges, sparks, sport FX) is confined to
    // the side bands so nothing ever paints over the transparent ADAS window.
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, 520, H); ctx.rect(1400, 0, 520, H); ctx.clip();
    if (state.sportMix > 0.01) drawSportBackground(state.sportMix, now, speedT, menuOpen);
    if (!staticLayer.left) staticLayer.left = buildStatic(LEFT);
    if (!staticLayer.right) staticLayer.right = buildStatic(RIGHT);
    ctx.drawImage(staticLayer.left, 0, 0);
    if (!menuOpen) ctx.drawImage(staticLayer.right, 0, 0);

    // LEFT speedometer: fills from bottom-left (A0) clockwise.
    var leftTipDeg = A0 + fSpeed * SWEEP;
    drawBand(LEFT, A0, leftTipDeg, false, color);
    if (cfg.lightning) arcLightning(LEFT, A0, leftTipDeg, color, overload);
    var tipL = drawTip(LEFT, leftTipDeg, color);

    var tipR = null, rightTipDeg = 0;
    if (menuOpen) {
      // Vertical bipolar bar (same color + independent scales as the circular meter).
      drawPowerBar(powerFrac, rColor);
    } else {
      // RIGHT power meter: zero at TOP; traction clockwise, regen anticlockwise.
      rightTipDeg = TOP + powerFrac * (SWEEP / 2);
      drawBand(RIGHT, TOP, rightTipDeg, powerFrac < 0, rColor);
      if (cfg.lightning) arcLightning(RIGHT, TOP, rightTipDeg, rColor, overload * Math.abs(powerFrac) + overload * 0.25);
      tipR = drawTip(RIGHT, rightTipDeg, rColor);
    }

    // Sparks off the tips, more with speed. Tangent direction = arc direction.
    if (cfg.sparks) {
      var leftRate = (speedT * 2.2 + accelN * 1.0) * scale * sportK;
      emit(tipL, leftTipDeg + 90, leftRate, color);
      if (tipR) {
        var rightRate = (Math.abs(powerFrac) * 1.6 + speedT * 0.8) * scale * sportK;
        emit(tipR, rightTipDeg + (powerFrac < 0 ? -90 : 90), rightRate, rColor);
      }
    }
    drawSparks(dt);

    ctx.restore();                                    // end side-band clip

    // Beast Mode layers render OVER EVERYTHING (full screen, unclipped) so the
    // SPORT reveal — claws and shockwaves — sweeps across the whole cluster.
    drawWaves(dt);
    drawClaws(dt);

    // Screen shake shakes the whole stage (canvas + readouts).
    if (beast.shake > 0.01) {
      var mag = beast.shake * 22;
      applyStageTransform((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
      shakeOn = true;
    } else if (shakeOn) { applyStageTransform(0, 0); shakeOn = false; }

    // DOM readouts
    setText(els.speed, Math.round(state.dSpeed));
    setText(els.power, Math.round(state.dPower));
    setText(els.rightState, regen ? "REGEN" : (state.dPower > 0.3 ? "TRAÇÃO" : "—"));
    setText(els.gear, state.gear);
    setText(els.drive, state.drive);
    els.speedBox.style.setProperty("--glow", rgba(color, 0.6));
    els.gearBox.style.setProperty("--glow", rgba(color, 0.6));
    els.rightBox.style.setProperty("--glow", rgba(rColor, 0.6));

    var alive = anySpark() ||
      Math.abs(state.speed - state.dSpeed) > 0.3 ||
      Math.abs(signedPower() - state.dPower) > 0.3 ||
      state.gearFlash > 0 || overload > 0.06 ||
      beast.sport || beast.intro > 0 || beast.shake > 0 ||
      beast.claws.length > 0 || beast.waves.length > 0 ||
      state.sportMix > 0.01 ||
      Math.abs(beast.mawOpen - mawTarget) > 0.01;
    if (alive && !motion.matches) raf = requestAnimationFrame(render);
  }

  var sparkCarry = 0;
  function emit(tip, angDeg, rate, color) {
    sparkCarry += rate;
    var n = Math.floor(sparkCarry);
    sparkCarry -= n;
    if (n > 0) emitSparks(tip, angDeg, n, color);
  }

  function setText(node, v) { var s = String(v); if (node && node.textContent !== s) node.textContent = s; }
  function kick() { if (!raf && !state.disposed && state.active) raf = requestAnimationFrame(render); }

  // ---------------------------------------------------------------------------
  // Telemetry wiring (v1.0 bridge contract)
  // ---------------------------------------------------------------------------
  // Canonical telemetry keys (mirrors ApexGT core). Projection flags arrive as
  // push-only signals; stored so the full data set is handled even if not shown.
  var KEYS = {
    "car.basic.vehicle_speed": "speed",
    "car.basic.engine_speed": "rpm",
    "car.basic.total_odometer": "odometer",
    "car.basic.gear_status": "gear",
    "car.drive_setting.drive_mode": "drive",
    "car.ev_setting.power_model_config": "propulsion",
    "car.basic.inside_temp": "insideTemp",
    "car.basic.outside_temp": "outsideTemp",
    "car.configure.default_temp_unit": "tempUnit",
    "car.basic.remain_fuel_percentage": "fuel",
    "car.ev_info.cur_battery_power_percentage": "battery",
    "car.ev_info.fuel_mode_remain_odometer": "fuelRange",
    "car.ev_info.electric_mode_remain_odometer": "batteryRange",
    "car.basic.cur_journey_odometer": "trip",
    "car.basic.cur_journey_avg_fuel_consume": "consumption",
    "car.ev_info.power_battery_voltage": "voltage",
    "car.ev_info.cur_charge_current": "current",
    "carPlayInDash": "carPlayInDash",
    "projectionMirrorInDash": "projectionMirrorInDash",
    "aaClusterInDash": "aaClusterInDash",
    "projectionPreparingD3": "projectionPreparingD3"
  };
  // Legacy aliases are only a fallback before the canonical reading of a field.
  var ALIASES = {
    carSpeed: "speed", engineRPM: "rpm", odometer: "odometer", gearState: "gear",
    drivingMode: "drive", evMode: "propulsion", inside_temp: "insideTemp",
    outside_temp: "outsideTemp", tempUnit: "tempUnit", fuelPercent: "fuel",
    batteryPercent: "battery", fuelRange: "fuelRange", batteryRange: "batteryRange"
  };
  var PROJECTION_FIELDS = { carPlayInDash: 1, projectionMirrorInDash: 1, aaClusterInDash: 1, projectionPreparingD3: 1 };
  var canonicalFields = Object.create(null);

  function num(v) {
    if (typeof v !== "number" && typeof v !== "string") return null;
    if (typeof v === "string" && !/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(v.trim())) return null;
    var n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function boolVal(v) { return v === true || v === 1 || v === "1" || v === "true"; }
  function enumVal(v, labels) {
    var n = num(v);
    if (n !== null && Object.prototype.hasOwnProperty.call(labels, String(n))) return labels[String(n)];
    var s = typeof v === "string" ? v.trim().toUpperCase() : "";
    return Object.keys(labels).some(function (k) { return labels[k] === s; }) ? s : null;
  }

  function apply(key, value, allowAlias) {
    if (state.disposed) return;
    // Feed the menu subsystem every key (it owns trip/tire/AC/setting fields the
    // gauge layer ignores). It filters by its own key table.
    if (menus) menus.update(key, value, allowAlias);
    // Cluster visibility is driven by clusterEnabled (not the card) — see the
    // check-cluster-visibility contract. Card 0 stays a live PAINEL.
    if (key === "clusterEnabled") {
      var vis = !(value === false || value === 0 || value === "0" || value === "false");
      document.body.classList.toggle("hidden-card", !vis);
      state.active = vis;
      if (vis) { lastFrame = 0; kick(); }
      else if (raf) { cancelAnimationFrame(raf); raf = 0; }
      return;
    }
    var field = KEYS[key] || (allowAlias ? ALIASES[key] : null);
    if (!field) return;
    // A canonical reading locks the field; later aliases must not override it.
    if (KEYS[key]) canonicalFields[field] = true;
    else if (canonicalFields[field]) return;

    if (field === "gear") {
      var g = enumVal(value, GEARS) || "--";
      if (state.gear !== g) { state.gearFlash = 0.5; state.gear = g; }
      kick(); scheduleReadouts(); return;
    }
    if (field === "drive") {
      var prevDrive = state.drive;
      state.drive = enumVal(value, DRIVES) || "--";
      if (state.drive === "SPORT" && prevDrive !== "SPORT") { beast.sport = true; triggerBeast(); }
      else if (state.drive !== "SPORT" && prevDrive === "SPORT") { beast.sport = false; }
      stage.classList.toggle("sport-mode", beast.sport);
      kick(); scheduleReadouts(); return;
    }
    if (field === "propulsion") {
      if (key === "evMode" && typeof value === "string" &&
          /^HEV (?:INTELIGENTE|PRIORIDADE \d+%)$/i.test(value.trim())) value = "HEV";
      state.propulsion = enumVal(value, PROPULSION) || "--";
      scheduleReadouts(); return;
    }
    if (PROJECTION_FIELDS[field]) { state[field] = boolVal(value); scheduleReadouts(); return; }

    // Numeric fields, with the same sentinels/guards ApexGT applies.
    if (allowAlias && key === "tempUnit" && value === "°F") value = 1;
    var n = num(value);
    if ((field === "insideTemp" || field === "outsideTemp") && (n === -1 || n === 255)) n = null;
    if (field !== "insideTemp" && field !== "outsideTemp" && field !== "current" && n !== null && n < 0) n = null;
    if ((field === "fuel" || field === "battery") && n !== null && n > 100) n = null;

    if (field === "speed") { if (n === null) return; state.speed = clamp(n, 0, 320); kick(); scheduleReadouts(); return; }
    if (field === "voltage") { state.voltage = n; kick(); return; }
    if (field === "current") { state.current = n; kick(); return; }

    if (state[field] === n) return;
    state[field] = n;
    scheduleReadouts();
  }

  // Derived readouts are painted on their own rAF so they stay current even when
  // the gauge animation loop is idle (parked car, reduced motion, etc.).
  function fmt(v, dec) {
    if (v === null || !Number.isFinite(v)) return "--";
    var f = v.toFixed(dec || 0);
    return Number(f) === 0 ? (0).toFixed(dec || 0) : f;
  }
  function fillBar(node, pct) {
    if (!node) return;
    var t = "scaleX(" + (pct === null ? 0 : clamp(pct, 0, 100) / 100) + ")";
    if (node.style.transform !== t) node.style.transform = t;
  }
  var roRaf = 0;
  function scheduleReadouts() {
    if (state.disposed || roRaf) return;
    roRaf = requestAnimationFrame(function () { roRaf = 0; paintReadouts(); });
  }
  function paintReadouts() {
    if (state.disposed) return;
    var tu = state.tempUnit === 1 ? "°F" : "°C";
    setText(els.outTemp, state.outsideTemp === null ? "--" : fmt(state.outsideTemp) + tu);
    setText(els.inTemp,  state.insideTemp === null ? "--" : fmt(state.insideTemp) + tu);
    setText(els.fuelPercent, state.fuel === null ? "--" : fmt(state.fuel) + "%");
    setText(els.fuelLiters,  state.fuel === null ? "--" : fmt(state.fuel * FUEL_TANK_LITERS / 100, 1) + " L");
    setText(els.fuelRange,   fmt(state.fuelRange) + " km");
    fillBar(els.fuelFill, state.fuel);
    setText(els.batteryPercent, state.battery === null ? "--" : fmt(state.battery) + "%");
    setText(els.batteryRange,   fmt(state.batteryRange) + " km");
    fillBar(els.batteryFill, state.battery);
    setText(els.odometer, fmt(state.odometer));
    setText(els.trip, fmt(state.trip, 1));
    // Source is L/100 km; show km/L (reciprocal), or L/100 km when zero.
    setText(els.consumption, state.consumption === null ? "--"
            : fmt(state.consumption > 0 ? 100 / state.consumption : 0, 1));
    setText(els.consumptionUnit, state.consumption === 0 ? "L/100km" : "km/L");
    var total = (state.fuelRange === null || state.batteryRange === null) ? null : state.fuelRange + state.batteryRange;
    setText(els.totalRange, fmt(total));
    setText(els.propulsion, state.propulsion || "--");
    if (els.rpmReadout) {
      var showRpm = state.rpm !== null && state.rpm > 0;
      els.rpmReadout.hidden = !showRpm;
      if (showRpm) setText(els.engineRpm, fmt(state.rpm));
    }
  }

  window.onDataChanged = function (k, v) { apply(k, v, false); };
  window.control = function (k, v) { apply(k, v, true); };
  window.onCardChanged = function (cardId) {
    var n = Number(cardId);
    state.card = n;
    // Cards 0/1/3 all keep the gauges live (PAINEL / MENU / AC); visibility is a
    // separate clusterEnabled signal. The menu overlay owns card 1 and card 3.
    if (menus) menus.onCardChanged(n);
    lastFrame = 0; kick();
  };
  window.onKeyEvent = function (keyName) { if (menus) menus.onKeyEvent(keyName); };
  window.showScreen = function () {};
  window.focus = function () {};
  window.cleanup = function () {
    if (state.disposed) return;
    state.disposed = true;
    if (menus) { try { menus.cleanup(); } catch (e) {} }
    if (raf) cancelAnimationFrame(raf);
    if (heartbeat) clearInterval(heartbeat);
    if (demoTimer) clearInterval(demoTimer);
    if (beastBannerTimer) clearTimeout(beastBannerTimer);
    window.removeEventListener("pagehide", window.cleanup);
    if (subscribed.length && window.Android && window.Android.unsubscribe) {
      try { window.Android.unsubscribe(JSON.stringify(subscribed)); } catch (e) {}
    }
  };

  var subscribed = [];
  function loadConfig(bridge) {
    if (!bridge || !bridge.getPreference) return;
    try {
      cfg.intensity = bridge.getPreference("stormIntensity", cfg.intensity) || cfg.intensity;
      cfg.lightning = bridge.getPreference("stormLightning", "true") !== "false";
      cfg.sparks = bridge.getPreference("stormSparks", "true") !== "false";
      var sv = Number(bridge.getPreference("stormSaturateSpeed", String(cfg.saturateSpeed)));
      if (Number.isFinite(sv) && sv > 0) cfg.saturateSpeed = sv;
      cfg.coldColor = parseHex(bridge.getPreference("apexColorCold", "")) || cfg.coldColor;
      cfg.hotColor = parseHex(bridge.getPreference("apexColorHot", "")) || cfg.hotColor;
      cfg.regenColor = parseHex(bridge.getPreference("apexColorRegen", "")) || cfg.regenColor;
      var ts = Number(bridge.getPreference("apexTractionScale", String(cfg.tractionScale)));
      if (Number.isFinite(ts) && ts > 0) cfg.tractionScale = ts;
      var rs = Number(bridge.getPreference("apexRegenScale", String(cfg.regenScale)));
      if (Number.isFinite(rs) && rs > 0) cfg.regenScale = rs;
    } catch (e) {}
    applyColors();
  }

  function subscribe() {
    var bridge = window.Android;
    if (!bridge || typeof bridge.subscribe !== "function") return false;
    loadConfig(bridge);
    var available = [];
    try { if (bridge.getAvailableKeys) available = JSON.parse(bridge.getAvailableKeys()); } catch (e) {}
    var prefs = ["app.preferences.stormIntensity", "app.preferences.stormLightning",
                 "app.preferences.stormSparks", "app.preferences.stormSaturateSpeed",
                 "app.preferences.apexColorCold", "app.preferences.apexColorHot",
                 "app.preferences.apexColorRegen", "app.preferences.apexTractionScale",
                 "app.preferences.apexRegenScale"];
    // Union of gauge keys + the menu subsystem's keys (trip/tire/AC/settings) +
    // the clusterEnabled visibility signal, de-duplicated.
    var carKeys = Object.keys(KEYS).concat(menus ? menus.keys : []).concat(["clusterEnabled"]);
    var seenKey = Object.create(null);
    carKeys = carKeys.filter(function (k) { if (seenKey[k]) return false; seenKey[k] = true; return true; });
    var wanted = carKeys.concat(prefs);
    subscribed = wanted.filter(function (k) {
      return k.indexOf("app.preferences.") === 0 || !available.length || available.indexOf(k) !== -1;
    });
    try { bridge.subscribe(JSON.stringify(subscribed)); } catch (e) { subscribed = []; return false; }
    if (bridge.getCarData) {
      carKeys.forEach(function (k) { try { apply(k, bridge.getCarData(k), false); } catch (e) {} });
    }
    return true;
  }

  var origDataChanged = window.onDataChanged;
  window.onDataChanged = function (k, v) {
    if (k === "app.preferences.stormIntensity") { cfg.intensity = v || cfg.intensity; kick(); return; }
    if (k === "app.preferences.stormLightning") { cfg.lightning = (v === "true" || v === true || v === "1"); kick(); return; }
    if (k === "app.preferences.stormSparks") { cfg.sparks = (v === "true" || v === true || v === "1"); kick(); return; }
    if (k === "app.preferences.stormSaturateSpeed") { var n = Number(v); if (n > 0) cfg.saturateSpeed = n; kick(); return; }
    if (k === "app.preferences.apexColorCold") { var c = parseHex(v); if (c) { cfg.coldColor = c; applyColors(); kick(); } return; }
    if (k === "app.preferences.apexColorHot") { var c = parseHex(v); if (c) { cfg.hotColor = c; applyColors(); kick(); } return; }
    if (k === "app.preferences.apexColorRegen") { var c = parseHex(v); if (c) { cfg.regenColor = c; applyColors(); kick(); } return; }
    if (k === "app.preferences.apexTractionScale") { var n = Number(v); if (n > 0) cfg.tractionScale = n; kick(); return; }
    if (k === "app.preferences.apexRegenScale") { var n = Number(v); if (n > 0) cfg.regenScale = n; kick(); return; }
    origDataChanged(k, v);
  };

  // ---------------------------------------------------------------------------
  // Clock, heartbeat, fit-to-window, dev demo
  // ---------------------------------------------------------------------------
  var heartbeat = null, demoTimer = null, beastBannerTimer = null;

  var viewScale = 1, viewLeft = 0, viewTop = 0;
  function fit() {
    viewScale = Math.min(window.innerWidth / W, window.innerHeight / H);
    viewLeft = (window.innerWidth - W * viewScale) / 2;
    viewTop = (window.innerHeight - H * viewScale) / 2;
    applyStageTransform(0, 0);
  }
  function applyStageTransform(dx, dy) {
    stage.style.left = "0px"; stage.style.top = "0px";
    stage.style.transform = "translate(" + (viewLeft + dx) + "px," + (viewTop + dy) + "px) scale(" + viewScale + ")";
  }
  window.addEventListener("resize", fit);

  // Browser-only preview driver. Never runs when the native bridge is present.
  function startDemo() {
    var t = 0, frames = 0, sport = false;
    state.gear = "D";
    apply("car.drive_setting.drive_mode", "0", false);   // start NORMAL
    // Seed the full telemetry set so every readout is exercised in the preview.
    apply("car.basic.total_odometer", "48213", false);
    apply("car.basic.remain_fuel_percentage", "62", false);
    apply("car.ev_info.cur_battery_power_percentage", "81", false);
    apply("car.ev_info.fuel_mode_remain_odometer", "430", false);
    apply("car.ev_info.electric_mode_remain_odometer", "72", false);
    apply("car.basic.cur_journey_odometer", "32.4", false);
    apply("car.basic.cur_journey_avg_fuel_consume", "8.0", false);
    apply("car.basic.outside_temp", "23", false);
    apply("car.basic.inside_temp", "24", false);
    apply("car.configure.default_temp_unit", "0", false);
    apply("car.ev_setting.power_model_config", "0", false);  // HEV
    apply("car.basic.engine_speed", "0", false);
    // Menu-only telemetry so the MENU (info/graphs/trips) and AC previews fill in.
    apply("car.basic.cur_journey_drivetime", "47", false);
    apply("car.basic.avg_vehicle_speed_since_startup", "38.5", false);
    apply("car.basic.accumulated_odometer", "1284.6", false);
    apply("car.basic.accumulated_drivetime", "1890", false);
    apply("car.basic.avg_fuel_consumption", "7.4", false);
    apply("car.basic.vehicle_speed_since_reset", "41.2", false);
    apply("car.basic.tire_pressure_front_left", "221", false);
    apply("car.basic.tire_pressure_front_right", "223", false);
    apply("car.basic.tire_pressure_rear_left", "219", false);
    apply("car.basic.tire_pressure_rear_right", "224", false);
    apply("car.drive_setting.steering_wheel_assist_mode", "0", false);
    apply("car.ev_setting.energy_recovery_level", "0", false);
    apply("car.drive_setting.esp_enable", "1", false);
    apply("car.ev_info.power_battery_voltage", "352", false);
    apply("car.ev_info.cur_charge_current", "18", false);
    apply("car.hvac.power_mode", "1", false);
    apply("car.hvac.fan_speed", "4", false);
    apply("car.hvac.driver_temperature", "22.5", false);
    apply("car.hvac.auto_enable", "1", false);
    apply("car.hvac.cycle_mode", "0", false);
    demoTimer = setInterval(function () {
      t += 0.05; frames++;
      var base = (Math.sin(t) * 0.5 + 0.5);
      var surge = Math.max(0, Math.sin(t * 2.3)) * 0.4;
      var target = clamp(base * 0.8 + surge, 0, 1);
      state.speed = target * 160;
      state.power = Math.sin(t * 1.7) * 78;              // traction/regen swing
      if (frames % 70 === 0) {                            // toggle drive mode ~every 8.4s
        sport = !sport;
        apply("car.drive_setting.drive_mode", sport ? "1" : "0", false);
      }
      if (frames % 40 === 0) {                            // slow drift on fuel/battery
        apply("car.basic.remain_fuel_percentage", String(55 + Math.round(10 * (Math.sin(t * 0.3) * 0.5 + 0.5))), false);
        apply("car.ev_info.cur_battery_power_percentage", String(70 + Math.round(25 * (Math.sin(t * 0.4 + 1) * 0.5 + 0.5))), false);
      }
      kick();
    }, 120);
  }

  window.addEventListener("pagehide", window.cleanup);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
    else if (state.active) { lastFrame = 0; kick(); }
  });

  // Build the menu subsystem before wiring telemetry so the first snapshot and
  // card change reach it. Degrades gracefully if the module failed to load.
  if (window.StormMenus) {
    try { menus = window.StormMenus.create({ root: stage, mount: document.getElementById("storm-menus") }); } catch (e) { menus = null; }
  }

  applyColors();
  fit();
  scheduleReadouts();
  if (subscribe()) {
    if (window.Android && window.Android.heartbeat) {
      heartbeat = setInterval(function () { try { window.Android.heartbeat(); } catch (e) {} }, 2000);
    }
    kick();
  } else {
    startDemo();
  }
})();
</script>
</body>
</html>
