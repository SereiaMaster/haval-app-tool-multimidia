<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Storm</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    color: #eaf4ff;
  }
  /* Fixed 1920x720 reference plane. The host renders exactly this; the browser
     preview scales it to fit via JS transform. */
  #stage {
    position: absolute; top: 0; left: 0;
    width: 1920px; height: 720px;
    transform-origin: top left;
    background: transparent;        /* surfaces below paint the dark cluster */
  }

  /* Opaque cluster surfaces — EXACTLY the geometry the other themes use, so the
     native ADAS window (x520-1400, y120-650) and the native top band stay clear,
     and the fuel/battery/odometer/trip readouts sit on a real bottom bar instead
     of leaking the car's own panel info behind them. */
  /* Base matches the car's near-black native cluster (same as the other themes)
     so the opaque side/footer surfaces blend seamlessly into the transparent
     central ADAS window. The neon glow fades fully to that black BEFORE the ADAS
     edge (x520 / x1400), so there is no visible seam against the OEM background. */
  .surface { position: absolute; z-index: 1; pointer-events: none;
             background: #010305; overflow: hidden; }
  /* Side panels bleed past the physical edges (top/left/right/bottom) to swallow
     the OEM cluster overscan slivers still visible on the car; the INNER edges
     stay at x520 / x1400 so the central ADAS window is untouched. */
  /* The INNER edge of each panel is feathered (mask fade) so the opaque dark
     dissolves softly into the transparent central ADAS window instead of a hard
     seam — a smooth blur-like color transition. Outer edges stay solid (they
     bleed off-screen). The neon gauges live on the canvas above and are NOT
     masked, so arcs/ticks stay crisp. */
  /* Each side panel stays fully opaque up to the ADAS boundary (x520 / x1400) so
     the OEM clusters remain covered, then feathers ONLY its inner edge a few pixels
     INTO the central ADAS window for a soft panel->ADAS transition. Feathering
     inward (toward the sides) is avoided because it would re-expose the OEM sliver
     the panels are meant to hide. The footer feathers its top edge the same way. */
  #surf-left  { left: -80px; top: 72px; width: 648px; height: 648px;
                background: radial-gradient(360px 420px at 342px 288px, rgba(18,36,60,0.42), rgba(1,3,5,0) 60%), #010305;
                -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent);
                        mask-image: linear-gradient(to right, #000 calc(100% - 48px), transparent); }
  #surf-right { right: -80px; top: 72px; width: 648px; height: 648px;
                background: radial-gradient(360px 420px at 306px 288px, rgba(18,36,60,0.42), rgba(1,3,5,0) 60%), #010305;
                -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent);
                        mask-image: linear-gradient(to left, #000 calc(100% - 48px), transparent); }
  #surf-footer{ left: 520px; top: 650px; width: 880px; height: 70px; background: #010305;
                -webkit-mask-image: linear-gradient(to top, #000 calc(100% - 44px), transparent);
                        mask-image: linear-gradient(to top, #000 calc(100% - 44px), transparent); }

  /* SPORT red wash — ONE continuous translucent layer across the whole cluster
     (both sides + footer), fading to clear in the central ADAS window, so there
     are no "boxed" red edges like before. The gradient color is set from the
     theme config at runtime (default red) and kept low-alpha so it tints rather
     than floods. Sits above the opaque panels (z1) but below the neon canvas
     (z2 in DOM order), so the gauge colors stay pure. */
  #sport-wash {
    position: absolute; inset: 0; z-index: 1; opacity: 0;
    transition: opacity .5s ease; pointer-events: none;
  }
  #stage.sport-mode #sport-wash { opacity: 1; }

  /* Gauges above the surfaces; DOM readouts above the gauges. */
  .readout, .corner, .panel, #info-rail, #beast-banner, #rpm-readout { z-index: 4; }
  /* Center column stays clear for the OEM ADAS / speed-limit / ESP overlays. */
  #storm { position: absolute; top: 0; left: 0; display: block; z-index: 2; }

  .readout { position: absolute; text-align: center; pointer-events: none; }
  .readout .big {
    font-weight: 800; font-size: 80px; line-height: 1; letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 22px var(--glow, rgba(90,170,255,0.6));
  }
  .readout .unit { font-size: 24px; font-weight: 600; opacity: 0.7; letter-spacing: 2px; }

  /* Circles live in the clear side bands, fully outside the center ADAS zone.
     Numbers sit high in each dial, above the fixed OEM telltale band (y 315-565). */
  #speed-box { left: 12px;   width: 500px; top: 200px; }
  #right-box { left: 1408px; width: 500px; top: 200px; }
  #right-box .big { font-size: 74px; }
  #right-state { font-size: 23px; font-weight: 700; letter-spacing: 4px; margin-top: 2px;
                 color: var(--glow, rgba(120,190,255,0.85)); opacity: 0.9; }

  .chip {
    position: absolute; text-align: center; pointer-events: none;
    font-weight: 700; letter-spacing: 3px;
  }
  #gear { font-size: 54px; font-weight: 800; line-height: 1;
          text-shadow: 0 0 16px var(--glow, rgba(90,170,255,0.55)); }
  #drive { font-size: 24px; font-weight: 800; letter-spacing: 3px; }

  /* ---- Telemetry readouts (ApexGT data parity, Apex Storm styling) ---- */
  .corner { position: absolute; font-weight: 700; font-size: 26px; letter-spacing: 1px;
            opacity: .82; color: #dbe9ff; text-shadow: 0 0 14px rgba(90,170,255,.45);
            pointer-events: none; }
  #out-temp { left: 26px;  top: 16px; text-align: left; }
  #in-temp  { right: 26px; top: 16px; text-align: right; }

  /* Bottom side panels sit well below the fixed OEM telltale band (y 315-565). */
  .panel { position: absolute; top: 598px; width: 470px; height: 118px;
           display: flex; align-items: center; gap: 20px; pointer-events: none; }
  #left-panel  { left: 18px; }
  #right-panel { right: 18px; flex-direction: row-reverse; text-align: right; }
  .metric { flex: 1; }
  .metric .mlabel { font-size: 15px; font-weight: 800; letter-spacing: 3px; opacity: .55; margin-bottom: 7px; }
  .metric .mrow { display: flex; gap: 14px; margin-top: 8px; font-size: 20px; font-weight: 700; }
  #right-panel .mrow { justify-content: flex-end; }
  .metric .mrow span:nth-child(2) { opacity: .55; }
  .bar { width: 100%; height: 10px; border-radius: 6px; overflow: hidden;
         background: rgba(120,150,185,0.16); box-shadow: inset 0 0 0 1px rgba(150,180,210,.12); }
  .bar > i { display: block; height: 100%; transform-origin: left; transform: scaleX(0);
             transition: transform .4s ease; }
  #fuel-fill    { background: linear-gradient(90deg,#ffb347,#ff5a3c); box-shadow: 0 0 12px rgba(255,120,60,.6); }
  #battery-fill { background: linear-gradient(90deg,#2effb0,#4ad0ff); box-shadow: 0 0 12px rgba(60,255,180,.6); }
  .phead { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #propulsion-mode { font-size: 18px; font-weight: 800; letter-spacing: 2px; opacity: .55; }

  /* Spans the footer bar (y650-720) and centers its items vertically within it. */
  #info-rail { position: absolute; left: 520px; width: 880px; top: 650px; height: 70px;
               display: flex; justify-content: space-between; align-items: center;
               pointer-events: none; opacity: .9; }
  #info-rail .ri { text-align: center; }
  #info-rail .ri b { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
                     text-shadow: 0 0 14px rgba(90,170,255,.4); }
  #info-rail .ri em { display: block; font-style: normal; font-size: 14px; font-weight: 700;
                      letter-spacing: 2px; opacity: .5; margin-top: 2px; }

  #rpm-readout { position: absolute; left: 26px; top: 560px; font-size: 16px; font-weight: 700;
                 letter-spacing: 1px; opacity: .7; pointer-events: none; }
  #rpm-readout[hidden] { display: none; }

  #beast-banner {
    position: absolute; left: 12px; width: 500px; top: 74px; text-align: center;
    font-weight: 900; font-size: 58px; letter-spacing: 7px;
    color: #fff; opacity: 0; pointer-events: none; transform: scale(0.5);
    text-shadow: 0 0 24px rgba(255,70,45,0.95), 0 0 54px rgba(255,0,0,0.6);
  }
  #beast-banner.show { animation: beastpop 1.15s ease-out forwards; }
  @keyframes beastpop {
    0%   { opacity: 0; transform: scale(0.4) rotate(-7deg); }
    16%  { opacity: 1; transform: scale(1.18) rotate(3deg); }
    30%  { transform: scale(1) rotate(0deg); }
    72%  { opacity: 1; }
    100% { opacity: 0; transform: scale(1.06); }
  }

  .hidden-card #stage > * { opacity: 0; transition: opacity .25s; }

  /* ---- Vehicle menus (ApexGT navigation parity, Apex Storm neon styling) ----
     Panel sits over the RIGHT dial (same placement as ApexGT and the other
     themes); only visible on card 1 (MENU) or card 3 (AC). The left dial and the
     center ADAS window keep running behind. */
  .apex-menus { position: absolute; left: 1508px; top: 145px; width: 392px; height: 430px;
    z-index: 6; color: #eaf4ff; font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    line-height: 1.15; font-variant-numeric: tabular-nums; overflow: hidden; pointer-events: auto;
    background: linear-gradient(145deg, rgba(8,16,28,0.93), rgba(2,6,12,0.96));
    border: 0; border-radius: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6), 0 0 48px rgba(60,140,255,0.22); }
  .apex-menus[hidden] { display: none !important; }
  .apex-menus button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 8px;
    appearance: none; -webkit-appearance: none; text-align: left; background: transparent; }
  .apex-menus button:focus-visible { outline: 2px solid #94e3ff; outline-offset: -2px; }
  .apex-menus [hidden] { display: none !important; }
  .apex-menu-cards { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; }
  .apex-menu-heading { height: 54px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; border-bottom: 1px solid rgba(90,170,255,0.18); }
  .apex-menu-heading h2 { font-size: 28px; line-height: 1; font-weight: 800; letter-spacing: 1.5px;
    margin: 0; white-space: nowrap; text-shadow: 0 0 18px rgba(90,170,255,0.5); }
  .apex-menu-heading > span { font-size: 18px; color: #8fb6d6; letter-spacing: 1px; margin-left: 8px; }
  .apex-menu-body { height: 336px; overflow: hidden; padding: 12px 12px 0; }
  .apex-menu-window { display: flex; flex-direction: column; gap: 10px; }
  .apex-menu-option { display: flex; align-items: center; width: 100%; height: 90px; padding: 10px 15px;
    background: rgba(10,20,32,0.72); border-left: 3px solid transparent !important; border-radius: 10px; }
  .apex-menu-option.is-focused { background: linear-gradient(90deg, rgba(26,70,110,0.85), rgba(8,20,32,0.6));
    border-left-color: #7fd4ff !important; box-shadow: 0 0 22px rgba(70,150,255,0.25); }
  .apex-menu-option > span { flex: 1; min-width: 0; }
  .apex-menu-option strong { display: block; font-size: 30px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  .apex-menu-option small { display: block; font-size: 18px; font-weight: 500; letter-spacing: .2px;
    color: #93b4cc; margin-top: 4px; white-space: nowrap; }
  .apex-menu-option .apex-menu-index { font-size: 18px; margin: 0 15px 0 0; color: #5f93b8; }
  .apex-menu-option.is-focused .apex-menu-index { color: #a9e4ff; }
  .apex-menu-option > b { font-size: 34px; font-weight: 400; color: #5c93c0; padding-left: 10px; }
  .apex-menu-option.is-focused > b { color: #bdecff; }
  .apex-menu-setting small { font-size: 18px; letter-spacing: .8px; margin: 0 0 2px; }
  .apex-menu-setting strong { font-size: 32px; line-height: 1.05; }
  .apex-menu-footer { position: absolute; bottom: 0; left: 12px; right: 12px; height: 40px; display: flex;
    align-items: center; justify-content: center; border-top: 1px solid rgba(90,170,255,0.16);
    color: #8fb6d6; font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  #apex-menu-feedback { color: #a9e0ff; }
  .apex-menu-tabs { display: flex; gap: 9px; height: 38px; margin-bottom: 12px; }
  .apex-menu-tabs button { flex: 1; text-align: center; background: transparent; color: #86a6bd;
    font-size: 21px; font-weight: 700; letter-spacing: 1px; border-radius: 0;
    border-bottom: 1px solid rgba(90,170,255,0.22); }
  .apex-menu-tabs button.is-selected { color: #cdefff; border-bottom-color: #7fd4ff;
    text-shadow: 0 0 16px rgba(90,170,255,0.55); }
  .apex-menu-stat { padding: 0 5px 8px; margin-bottom: 7px; border-bottom: 1px solid rgba(90,170,255,0.12); }
  .apex-menu-stat > small, .apex-menu-energy small { display: block; font-size: 17px; letter-spacing: .7px; color: #90b2cb; }
  .apex-menu-stat > strong { display: block; font-size: 33px; font-weight: 600; line-height: 1.12; margin-top: 2px; white-space: nowrap; }
  .apex-menu-energy { display: flex; padding: 0 5px; gap: 10px; }
  .apex-menu-energy > span { width: 50%; min-width: 0; }
  .apex-menu-energy strong { display: block; font-size: 32px; font-weight: 600; line-height: 1.12; margin: 3px 0 2px; }
  .apex-menu-energy em { font-size: 23px; font-style: normal; color: #93b4cc; white-space: nowrap; }
  .apex-menu-tire-caption { font-size: 17px; letter-spacing: 1px; color: #90b2cb; display: flex;
    justify-content: space-between; padding: 0 5px 6px; }
  .apex-menu-tires { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .apex-menu-tire { padding: 8px 10px; background: rgba(10,22,34,0.72); border-left: 1px solid rgba(90,170,255,0.4);
    border-radius: 8px; }
  .apex-menu-tire small { display: block; font-size: 16px; letter-spacing: .4px; color: #90b2cb; white-space: nowrap; }
  .apex-menu-tire strong { display: block; font-size: 40px; font-weight: 600; line-height: 1.1; margin-top: 3px; }
  .apex-menu-graph-reading { height: 56px; display: flex; align-items: baseline; gap: 9px; padding: 0 4px; }
  .apex-menu-graph-reading strong { font-size: 50px; font-weight: 600; line-height: 1; text-shadow: 0 0 18px rgba(90,170,255,0.45); }
  .apex-menu-graph-reading > span { font-size: 25px; color: #8fb2c9; }
  .apex-menu-graph-bars { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding-top: 8px;
    border-bottom: 1px solid rgba(90,170,255,0.4);
    background: repeating-linear-gradient(0deg, transparent 0, transparent 46px, rgba(60,130,190,0.18) 46px, rgba(60,130,190,0.18) 47px); }
  .apex-menu-graph-bars i { display: block; flex: 1; max-height: 100%; height: 2%;
    background: linear-gradient(0deg, #1766a8, #6fd0ff); border-top: 1px solid #bfeaff; border-radius: 2px; }
  .apex-menu-graph-bars i.is-empty { background: rgba(40,60,78,0.5); border-top-color: #3c5566; }
  .apex-menu-graph-bars i.is-regen { background: linear-gradient(0deg, #12806e, #47e0c0); border-top-color: #a8ffe8; }
  .apex-menu-graph-scale { display: flex; justify-content: space-between; padding-top: 7px; color: #80a3ba;
    font-size: 16px; letter-spacing: .5px; }
  .apex-menu-trip-distance { display: flex; align-items: baseline; gap: 9px; height: 54px; padding: 0 5px; white-space: nowrap; }
  .apex-menu-trip-distance strong { font-size: 46px; font-weight: 600; line-height: 1; text-shadow: 0 0 16px rgba(90,170,255,0.4); }
  .apex-menu-trip-distance > span { font-size: 25px; color: #90b2cb; }
  .apex-menu-trip-metrics { margin: 3px 5px 7px; }
  .apex-menu-trip-metrics > div { display: flex; justify-content: space-between; align-items: baseline;
    height: 42px; border-bottom: 1px solid rgba(90,170,255,0.14); }
  .apex-menu-trip-metrics dt { font-size: 17px; letter-spacing: .5px; color: #90b2cb; }
  .apex-menu-trip-metrics dd { font-size: 28px; font-weight: 600; white-space: nowrap; margin: 0; }
  .apex-menu-trip-reset { display: block; padding: 4px 5px 0; font-size: 16px; letter-spacing: 1px; color: #96cfe2; }
  .apex-menu-ac-control { display: flex; align-items: center; justify-content: space-between; width: 100%;
    height: 86px; background: rgba(10,20,32,0.72); padding: 12px 15px; margin-bottom: 11px;
    border-left: 3px solid transparent !important; border-radius: 10px; }
  .apex-menu-ac-control.is-selected { background: linear-gradient(90deg, rgba(26,70,110,0.85), rgba(8,20,32,0.6));
    border-left-color: #7fd4ff !important; box-shadow: 0 0 22px rgba(70,150,255,0.25); }
  .apex-menu-ac-control > span { width: 210px; }
  .apex-menu-ac-control small { display: block; font-size: 19px; letter-spacing: .8px; color: #93b4cc; white-space: nowrap; }
  .apex-menu-ac-control > strong { font-size: 44px; font-weight: 600; white-space: nowrap; letter-spacing: -.5px; }
  .apex-menu-temperature-rail { display: block; position: relative; width: 200px; height: 6px;
    background: rgba(40,60,78,0.8); margin-top: 11px; overflow: hidden; border-radius: 4px; }
  .apex-menu-temperature-rail > i { display: block; width: 100%; height: 100%;
    background: linear-gradient(90deg, #60caff, #dff4ff); transform-origin: left center; transform: scaleX(0); }
  .apex-menu-fan-level { display: flex; width: 200px; gap: 5px; height: 10px; margin-top: 10px; }
  .apex-menu-fan-level > i { flex: 1; background: rgba(42,60,74,0.9); border-radius: 2px; }
  .apex-menu-fan-level > i.is-on { background: #86d6ff; box-shadow: 0 0 8px rgba(90,170,255,0.6); }
  .apex-menu-ac-status { display: flex; gap: 7px; justify-content: space-between; padding: 3px 3px 8px;
    border-bottom: 1px solid rgba(90,170,255,0.14); }
  .apex-menu-ac-status small { display: block; color: #7398ad; font-size: 14px; letter-spacing: .8px; margin-bottom: 3px; }
  .apex-menu-ac-status strong { display: block; font-size: 24px; font-weight: 600; color: #9db8c7; white-space: nowrap; }
  .apex-menu-ac-status strong.is-on { color: #9ff0ee; }
  .apex-menu-ac-hold { display: flex; flex-direction: column; gap: 4px; padding: 9px 3px 0; color: #7c9fb3;
    font-size: 16px; letter-spacing: .3px; }
  .apex-menu-ac-hold b { font-weight: 700; color: #aed0dd; }

  /* ---- Música (tocando agora) ---- */
  .apex-menu-music { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 6px; }
  .apex-menu-music-cover { position: relative; width: 150px; height: 150px; border-radius: 14px; overflow: hidden;
    background: linear-gradient(145deg, rgba(26,70,110,0.5), rgba(8,18,30,0.8));
    box-shadow: 0 0 0 1px rgba(90,170,255,0.25), 0 10px 30px rgba(0,0,0,0.5); flex: none; }
  .apex-menu-music-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .apex-menu-music-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 64px; color: rgba(150,200,255,0.5); }
  .apex-menu-music-cover:not(.is-empty) .apex-menu-music-note { display: none; }
  .apex-menu-music-meta { width: 100%; text-align: center; min-width: 0; }
  .apex-menu-music-meta strong { display: block; font-size: 28px; font-weight: 700; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 16px rgba(90,170,255,0.4); }
  .apex-menu-music-meta span { display: block; font-size: 21px; color: #9cc0da; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .apex-menu-music-meta small { display: block; font-size: 17px; color: #7fa3bc; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .apex-menu-music-rail { width: 92%; height: 6px; border-radius: 4px; overflow: hidden;
    background: rgba(40,60,78,0.8); }
  .apex-menu-music-rail > i { display: block; width: 100%; height: 100%; transform-origin: left center; transform: scaleX(0);
    background: linear-gradient(90deg, #60caff, #dff4ff); box-shadow: 0 0 10px rgba(90,170,255,0.6); transition: transform .3s linear; }
  .apex-menu-music-foot { width: 92%; display: flex; justify-content: space-between; align-items: center;
    font-size: 17px; letter-spacing: .4px; color: #8fb2c9; }
  .apex-menu-music-foot #apex-menu-music-state { color: #a9e0ff; font-weight: 700; white-space: nowrap; }

  /* ---- Menu aberto: medidor direito vira barra vertical bipolar (desenhada no
     canvas); o readout de kW migra para a coluna à esquerda do painel e o painel
     direito fica totalmente opaco (sem feather) para cobrir o cluster nativo. ---- */
  #stage.menu-open #right-box { left: 1398px; width: 112px; top: 150px; }
  #stage.menu-open #right-box .big { font-size: 52px; }
  #stage.menu-open #right-box #right-state { font-size: 17px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div id="stage">
    <div id="surf-left" class="surface" aria-hidden="true"></div>
    <div id="surf-right" class="surface" aria-hidden="true"></div>
    <div id="surf-footer" class="surface" aria-hidden="true"></div>
    <div id="sport-wash" aria-hidden="true"></div>
    <canvas id="storm" width="1920" height="720" aria-hidden="true"></canvas>
    <div id="out-temp" class="corner">--</div>
    <div id="in-temp" class="corner">--</div>

    <div id="speed-box" class="readout">
      <div class="big" id="speed-value">--</div>
      <div class="unit">km/h</div>
    </div>
    <div id="right-box" class="readout">
      <div class="big" id="power-value">--</div>
      <div class="unit">kW</div>
      <div id="right-state">--</div>
    </div>

    <div id="rpm-readout" hidden><span id="engine-rpm">--</span> RPM</div>

    <div id="left-panel" class="panel">
      <div id="gear">--</div>
      <div class="metric">
        <div class="mlabel">COMBUSTÍVEL</div>

    function numberOrNull(value) {
        if (typeof value !== "number" && typeof value !== "string") return null;
        if (typeof value === "string" && !/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(value.trim())) return null;

        return Number.isFinite(number) ? number : null;

        }
        if (field === "mediaDuration" || field === "mediaPosition") return numberOrNull(value);
        if (labels[field]) {
            var raw = numberOrNull(value);
            if (raw !== null && Object.prototype.hasOwnProperty.call(labels[field], raw)) return raw;
            var label = typeof value === "string" ? value.trim().toUpperCase() : "";

            if (field === "esp" && (label === "ATIVO" || label === "INATIVO")) return label === "ATIVO" ? 1 : 0;
            var found = Object.keys(labels[field]).filter(function (key) { return labels[field][key] === label; });

        }

        var numeric = numberOrNull(value);
        if (numeric === null) return null;
        if (field === "insideTemp" || field === "outsideTemp") return numeric === -1 || numeric === 255 ? null : numeric;

        if (field === "acPower" || field === "acAuto" || field === "acRecycle" || field === "tempUnit") return numeric === 0 || numeric === 1 ? numeric : null;
        if (field === "current") return numeric;

    }

        var elements = Object.create(null);

        function renderInfo() {

            text("info-fuel", state.fuel === null ? "--" : number(Math.min(100, state.fuel)) + "%");

                var value = state["tire" + position];

        function renderGraph() {
            selectTabs("graph", graphIndex);
            var metric = graphIndex === 0 ? "power" : "speed";
            var value = graphIndex === 0 ? power() : state.speed;

                var ratio = sample === null ? 0 : Math.min(1, Math.abs(sample) / (metric === "speed" ? 180 : 100));

        function mediaSeconds(value, durationHint) {

            var pos = mediaSeconds(state.mediaPosition, state.mediaDuration);
            var ratio = (dur && dur > 0 && pos !== null) ? Math.max(0, Math.min(1, pos / dur)) : 0;

            text("music-time", clockTime(pos) + " / " + clockTime(dur));
            text("music-state", hasTrack ? (playing ? "▶ TOCANDO" : "❚❚ PAUSADO") : "");

        function render() {

            if (disposed || (card !== 1 && card !== 3)) return;
            var view = card === 3 ? "ac" : detail ? menuItems[menuIndex].view : "menu";
